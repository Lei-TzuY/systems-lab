name: Prepare container import manifest

on:
  push:
    branches:
      - phase0/bootstrap-container-import
    paths:
      - '.github/workflows/prepare-container-manifest.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0/bootstrap-container-import
          fetch-depth: 0
      - name: Promote frozen container source to READY
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/automation/prepare_container_manifest.py
          python3 scripts/validate_manifest.py
          git diff --check
      - name: Remove preparation-only files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/automation/prepare_container_manifest.py
          rm .github/workflows/prepare-container-manifest.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: mark container ready for import"
          git push origin HEAD:phase0/bootstrap-container-import
