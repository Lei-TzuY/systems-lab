name: Filesystem directory conformance integration

on:
  push:
    branches: [main]
    paths:
      - "integrations/filesystem-directory-conformance/**"
      - "projects/filesystem-lab/**"
      - "projects/systems-conformance-lab/**"
      - ".github/workflows/filesystem-directory-conformance.yml"
  pull_request:
    paths:
      - "integrations/filesystem-directory-conformance/**"
      - "projects/filesystem-lab/**"
      - "projects/systems-conformance-lab/**"
      - ".github/workflows/filesystem-directory-conformance.yml"

permissions:
  contents: read

jobs:
  directory-record-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust 1.81
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.81.0
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install conformance harness
        run: python -m pip install -e "projects/systems-conformance-lab[dev]"
      - name: Check Rust adapter formatting
        run: cargo fmt --manifest-path integrations/filesystem-directory-conformance/Cargo.toml -- --check
      - name: Lint Rust adapter
        run: cargo clippy --manifest-path integrations/filesystem-directory-conformance/Cargo.toml --no-deps -- -D warnings
      - name: Build Rust directory adapter
        run: cargo build --manifest-path integrations/filesystem-directory-conformance/Cargo.toml
      - name: Lint integration Python
        run: python -m ruff check integrations/filesystem-directory-conformance
      - name: Run differential conformance
        run: python -m pytest -q integrations/filesystem-directory-conformance/test_conformance.py
