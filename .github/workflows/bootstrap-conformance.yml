name: Bootstrap conformance import

on:
  push:
    branches: [main]
    paths:
      - "migration/bootstrap-conformance.json"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: b7df22b7004838b55054ec3d8d7b7a3b34df8137
      SOURCE_REPOSITORY: https://github.com/Lei-TzuY/systems-conformance-lab.git
      IMPORT_BRANCH: migration/systems-conformance-lab-b7df22b7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck frozen source
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "$SOURCE_REPOSITORY" refs/heads/main | cut -f1)"
          test "$remote_main" = "$SOURCE_SHA"
          open_prs="$(curl -fsSL 'https://api.github.com/repos/Lei-TzuY/systems-conformance-lab/pulls?state=open&per_page=1' | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          test "$open_prs" -eq 0
      - name: Import source with full ancestry
        run: |
          set -euo pipefail
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git remote add conformance-source "$SOURCE_REPOSITORY"
          git fetch conformance-source "$SOURCE_SHA"
          git switch -c "$IMPORT_BRANCH"
          git subtree add --prefix=projects/systems-conformance-lab "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$(git rev-parse 'HEAD:projects/systems-conformance-lab')"
          git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
