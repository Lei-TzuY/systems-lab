name: Userspace TCP/IP migration

on:
  push:
    branches: [main]
    paths:
      - "projects/userspace-tcpip-stack/**"
  pull_request:
    paths:
      - "projects/userspace-tcpip-stack/**"

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 2e4a58c027a18a4c3dc1d466d3adbe8b13550a0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preserved source ancestry and tree
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          imported_tree="$(git rev-parse 'HEAD:projects/userspace-tcpip-stack')"
          test "$source_tree" = "$imported_tree"

  fmt:
    needs: verify-history
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/userspace-tcpip-stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Cargo Fmt Check
        run: cargo fmt --all -- --check

  test:
    name: Test on ${{ matrix.os }}
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: projects/userspace-tcpip-stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cargo Test All Targets
        run: cargo test --locked --all-targets --verbose
      - name: Cargo Test Documentation
        run: cargo test --locked --doc --verbose
      - name: Cargo Build Release
        run: cargo build --locked --release --verbose

  msrv:
    name: Minimum supported Rust 1.88
    needs: fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/userspace-tcpip-stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - name: Test all targets on MSRV
        run: cargo test --locked --all-targets --verbose

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/userspace-tcpip-stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Run Clippy correctness gate
        run: cargo clippy --locked --all-targets --all-features -- -D clippy::correctness
