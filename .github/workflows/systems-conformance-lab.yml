name: Conformance migration

on:
  push:
    branches: [main]
    paths:
      - "projects/systems-conformance-lab/**"
  pull_request:
    paths:
      - "projects/systems-conformance-lab/**"

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: b7df22b7004838b55054ec3d8d7b7a3b34df8137
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preserved source ancestry and tree
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          imported_tree="$(git rev-parse 'HEAD:projects/systems-conformance-lab')"
          test "$source_tree" = "$imported_tree"

  test:
    needs: verify-history
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/systems-conformance-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
