name: Bootstrap hypervisor import

on:
  push:
    branches: [main]
    paths:
      - "migration/bootstrap-hypervisor.json"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: d32685b5453c3d1ae86ff76d0beac2b4af47094f
      SOURCE_REPOSITORY: https://github.com/Lei-TzuY/mini-hypervisor.git
      IMPORT_BRANCH: migration/mini-hypervisor-d32685b5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck frozen source
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "$SOURCE_REPOSITORY" refs/heads/main | cut -f1)"
          test "$remote_main" = "$SOURCE_SHA"
          open_prs="$(curl -fsSL 'https://api.github.com/repos/Lei-TzuY/mini-hypervisor/pulls?state=open&per_page=1' | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          test "$open_prs" -eq 0
      - name: Import source with full ancestry
        run: |
          set -euo pipefail
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git remote add hypervisor-source "$SOURCE_REPOSITORY"
          git fetch hypervisor-source "$SOURCE_SHA"
          git switch -c "$IMPORT_BRANCH"
          git subtree add --prefix=projects/mini-hypervisor "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$(git rev-parse 'HEAD:projects/mini-hypervisor')"
          git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
