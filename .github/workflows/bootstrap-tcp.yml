name: Bootstrap TCP/IP import

on:
  push:
    branches: [main]
    paths:
      - "migration/bootstrap-tcp.json"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 2e4a58c027a18a4c3dc1d466d3adbe8b13550a0d
      SOURCE_REPOSITORY: https://github.com/Lei-TzuY/userspace-tcpip-stack.git
      IMPORT_BRANCH: migration/userspace-tcpip-stack-2e4a58c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Recheck frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "$SOURCE_REPOSITORY" refs/heads/main | cut -f1)"
          test "$remote_main" = "$SOURCE_SHA"
          open_prs="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/Lei-TzuY/userspace-tcpip-stack/pulls?state=open&per_page=1' \
            | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          test "$open_prs" -eq 0
      - name: Import source with full ancestry
        run: |
          set -euo pipefail
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git remote add tcp-source "$SOURCE_REPOSITORY"
          git fetch tcp-source "$SOURCE_SHA"
          git switch -c "$IMPORT_BRANCH"
          git subtree add --prefix=projects/userspace-tcpip-stack "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          imported_tree="$(git rev-parse 'HEAD:projects/userspace-tcpip-stack')"
          test "$source_tree" = "$imported_tree"
          git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
